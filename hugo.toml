baseURL = "https://go-opentype.github.io/"
title = "go-opentype"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

[[params.repos]]
  name = "opentype"
  pkg = "github.com/go-opentype/opentype"
  url = "https://github.com/go-opentype/opentype"
  status = "ready"
  blurb = "The engine: a pure-Go, stdlib-only **sfnt** parser and anti-aliased rasteriser. **TrueType `glyf` + CFF + CFF2** outlines; **all cmap formats** (0/2/4/6/8/10/12/13/14 + variation selectors); **every GSUB and GPOS lookup type** with **GDEF + lookup flags** (mark filtering); **variable fonts** (`fvar`/`avar`/`gvar` + IUP, plus `HVAR`/`VVAR`/`MVAR` metric variation); the full **TrueType instruction hinter** and a **CFF/Type 2 stem grid-fitter** (blue zones, counter control, stem darkening); vertical metrics; and the **OpenType `MATH`** table. Feature parity with FreeType on the outline + hinting paths."

[[params.repos]]
  name = "bidi"
  pkg = "github.com/go-opentype/bidi"
  url = "https://github.com/go-opentype/bidi"
  status = "ready"
  blurb = "A pure-Go, stdlib-only implementation of the **Unicode Bidirectional Algorithm (UAX #9)** for mixed left-to-right / right-to-left text. `Bidi_Class` and paired-bracket properties are compiled into generated lookup tables — no `golang.org/x/text` dependency. `ResolveLevels`, `Reorder` and a `VisualOrder` convenience wrapper."

[[params.repos]]
  name = "shape"
  pkg = "github.com/go-opentype/shape"
  url = "https://github.com/go-opentype/shape"
  status = "ready"
  blurb = "A HarfBuzz-lite complex-text shaper composing the two siblings above: bidi reordering from `bidi` and the font's substitution/positioning tables from `opentype`. Dedicated shapers for **Arabic** (cursive joining), the **Indic** scripts (Devanagari, Bengali, Tamil, … — two-pass reordering, reph modes, split matras, dotted-circle), the **Universal Shaping Engine** (Thai/Lao, Khmer, Myanmar, Tibetan and ~100 more — sakot, split vowels, feature-driven reorder), **Egyptian hieroglyph** quadrats, **Hangul** jamo composition, **vertical** writing mode, and **Latin/default** (ligatures, marks, kerning) — all to positioned glyphs in visual order. Validated on real Noto fonts."

[[params.repos]]
  name = "fonts"
  pkg = "github.com/go-opentype/fonts"
  url = "https://github.com/go-opentype/fonts"
  status = "ready"
  blurb = "**44 legible, permissively-licensed families** — **Atkinson Hyperlegible**, Inter, Lora, JetBrains Mono, the Go pair, dozens of Noto faces, and non-Latin scripts (**Arabic, Hebrew, Devanagari, Thai, Egyptian Hieroglyphs**, plus **CJK** via Noto Sans SC) — each its own subpackage embedded via `go:embed`, so a binary links only the faces it imports. `fonts.MostLegible()` returns Atkinson Hyperlegible, designed by the Braille Institute to maximise character distinction for low-vision readers."
