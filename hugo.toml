baseURL = "https://go-opentype.github.io/"
title = "go-opentype"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.repos]]
  name = "opentype"
  pkg = "github.com/go-opentype/opentype"
  url = "https://github.com/go-opentype/opentype"
  status = "ready"
  blurb = "The engine: a pure-Go, stdlib-only **sfnt** parser and anti-aliased rasteriser. **TrueType `glyf` + CFF + CFF2** outlines; **all cmap formats** (0/2/4/6/8/10/12/13/14 + variation selectors); **every GSUB and GPOS lookup type** with **GDEF + lookup flags** (mark filtering); **variable fonts** (`fvar`/`avar`/`gvar` + IUP, plus `HVAR`/`VVAR`/`MVAR` metric variation); the full **TrueType instruction hinter** and a **CFF/Type 2 stem grid-fitter** (blue zones, counter control, stem darkening); vertical metrics; the **OpenType `MATH`** table; and **font subsetting + instancing** (`SubsetTrueType`/`SubsetCFF`, `Instance`) plus OS/2 **font-descriptor** accessors for PDF/CSS embedding. Feature parity with FreeType on the outline + hinting paths."

[[params.repos]]
  name = "bidi"
  org = "go-typeset"
  pkg = "github.com/go-typeset/bidi"
  url = "https://github.com/go-typeset/bidi"
  status = "ready"
  blurb = "A pure-Go, stdlib-only implementation of the **Unicode Bidirectional Algorithm (UAX #9)** for mixed left-to-right / right-to-left text. `Bidi_Class` and paired-bracket properties are compiled into generated lookup tables — no `golang.org/x/text` dependency. `ResolveLevels`, `Reorder` and a `VisualOrder` convenience wrapper. **It now lives in [go-typeset](https://github.com/go-typeset/bidi)**: the transfer left a redirect, so the old link still opens, but `go get github.com/go-opentype/bidi` fails — the module declares the new path and Go refuses the mismatch."

[[params.repos]]
  name = "shape"
  pkg = "github.com/go-opentype/shape"
  url = "https://github.com/go-opentype/shape"
  status = "ready"
  blurb = "A HarfBuzz-lite complex-text shaper composing the two siblings above: bidi reordering from `bidi` and the font's substitution/positioning tables from `opentype`. Dedicated shapers for **Arabic** (cursive joining), the **Indic** scripts (Devanagari, Bengali, Tamil, … — two-pass reordering, reph modes, split matras, dotted-circle), the **Universal Shaping Engine** (Thai/Lao, Khmer, Myanmar, Tibetan and ~100 more — sakot, split vowels, feature-driven reorder), **Egyptian hieroglyph** quadrats, **Hangul** jamo composition, **vertical** writing mode, and **Latin/default** (ligatures, marks, kerning) — all to positioned glyphs in visual order. Validated on real Noto fonts."

[[params.repos]]
  name = "fonts"
  pkg = "github.com/go-opentype/fonts"
  url = "https://github.com/go-opentype/fonts"
  status = "ready"
  blurb = "**46 legible, permissively-licensed families** — **Atkinson Hyperlegible**, Inter, Lora, JetBrains Mono, the Go pair, dozens of Noto faces, and non-Latin scripts (**Arabic, Hebrew, Devanagari, Thai, Egyptian Hieroglyphs**, plus **CJK** via Noto Sans SC, JP and KR) — each its own subpackage embedded via `go:embed`, so a binary links only the faces it imports. `fonts.MostLegible()` returns Atkinson Hyperlegible, designed by the Braille Institute to maximise character distinction for low-vision readers."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.02:1, bright on the dark background 8.99:1.
  base = "#b45309"
  deep = "#6e3305"
  bright = "#f59e0b"
  shadow = "rgba(180,83,9,.7)"
  glow = "rgba(180,83,9,.6)"
  wash = "rgba(180,83,9,.10)"
  washDeep = "rgba(110,51,5,.06)"
  chipBg = "#fef3e2"
  chipBorder = "#fce2b6"
  chipFg = "#6e3305"
  chipBgDark = "rgba(245,158,11,.14)"
  chipBorderDark = "rgba(245,158,11,.32)"
  chipFgDark = "#faca79"
  statsEnd = "#fde8c4"
  bandText = "#fdefd8"

# The strip under the top bar: the code's licence and cgo, and the data
# shipped under its own licence (read from its licence files).
[params.mantra]
  items = ["LICENSE=BSD-3-Clause", "CGO_ENABLED=0", "fonts: OFL-1.1, Bitstream-Vera, Arev"]
